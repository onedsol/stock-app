# Deployed copy lives at /opt/stock-app/compose.yml inside the LXC.
# Image tag comes from .env (STOCK_APP_TAG), so updating = change tag + pull + up.
services:
  stock-app:
    image: ${STOCK_APP_IMAGE:-ghcr.io/onedsol/stock-app}:${STOCK_APP_TAG:-latest}
    container_name: stock-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      SEC_USER_AGENT: ${SEC_USER_AGENT:?set SEC_USER_AGENT in .env, e.g. "StockDashboard/1.0 you@example.com"}
    labels:
      # --- Homepage (dashboard tile, discovered via socket-proxy) ---
      homepage.group: Finance
      homepage.name: Stock App
      homepage.icon: mdi-chart-line
      homepage.href: https://stocks.home.example.com
      homepage.description: Stock intelligence dashboard
      homepage.server: stock-app-lxc
      homepage.container: stock-app
      # --- Uptime Kuma (via AutoKuma) ---
      kuma.stock-app.http.name: Stock App
      kuma.stock-app.http.url: http://stock-app.lan:3001/api/health

  # Read-only Docker API so Homepage (on another host) can see this container.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"   # restrict to Homepage's IP with the Proxmox firewall
    read_only: true
    tmpfs:
      - /run
